# Tên của Workflow này, sẽ hiển thị trên GitHub Actions tab
name: Java CI Build

# Trigger (kích hoạt) Workflow này khi nào
on:
  push:
    branches: [ main, master ] # Kích hoạt khi có push vào các nhánh main hoặc master
  pull_request:
    branches: [ main, master ] # Kích hoạt khi có Pull Request

# Định nghĩa các công việc (jobs) sẽ được thực hiện
jobs:
  build:
    # Chỉ định môi trường chạy (runner)
    runs-on: ubuntu-latest

    # Các bước thực hiện
    steps:
    - name: Checkout code
      # Sử dụng action để tải mã nguồn về môi trường chạy
      uses: actions/checkout@v4

    - name: Set up Java
      # Sử dụng action để cài đặt Java Development Kit (JDK)
      uses: actions/setup-java@v4
      with:
        java-version: '17' # Phiên bản Java
        distribution: 'temurin' # Nhà phân phối JDK

    - name: Compile and Run Java Program and Test Output
      # ĐÃ SỬA LỖI: Chuyển hướng đầu ra sang file output.txt
      run: |
        echo "Compiling HelloWorld.java..."
        javac HelloWorld.java

        # Chuyển hướng đầu ra của chương trình Java vào file output.txt
        echo "Running HelloWorld and capturing output..."
        java HelloWorld > output.txt

        # Kiểm tra file output.txt
        if grep -q "Vinh Tran" output.txt; then
          echo "Test Passed: Output is correct."
        else
          echo "Test Failed: Output is not correct."
          # Hiển thị nội dung file để debug
          cat output.txt
          exit 1
        fi
    - name: Upload JAR Artifact
      # Tùy chọn: Đăng file JAR lên GitHub để bạn có thể tải về
      uses: actions/upload-artifact@v4
      with:
        name: HelloWorld-jar-file
        path: HelloWorld.jar
