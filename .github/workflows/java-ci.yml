# Tên của Workflow này, sẽ hiển thị trên GitHub Actions tab
name: Java CI Build

# Trigger (kích hoạt) Workflow này khi nào
on:
  push:
    branches: [ main, master ] # Kích hoạt khi có push vào các nhánh main hoặc master
  pull_request:
    branches: [ main, master ] # Kích hoạt khi có Pull Request

# Định nghĩa các công việc (jobs) sẽ được thực hiện
jobs:
  build:
    # Chỉ định môi trường chạy (runner)
    runs-on: ubuntu-latest

    # Các bước thực hiện
    steps:
    - name: Checkout code
      # Sử dụng action để tải mã nguồn về môi trường chạy
      uses: actions/checkout@v4

    - name: Set up Java
      # Sử dụng action để cài đặt Java Development Kit (JDK)
      uses: actions/setup-java@v4
      with:
        java-version: '17' # Phiên bản Java
        distribution: 'temurin' # Nhà phân phối JDK

    - name: Build and Test Executable JAR
      # ĐÃ CHỈNH SỬA: Thêm kiểm tra file và đảm bảo đóng gói JAR thành công.
      run: |
        echo "Compiling HelloWorld.java..."
        javac HelloWorld.java

        # Kiểm tra file .class đã được tạo chưa
        if [ ! -f HelloWorld.class ]; then
          echo "Error: HelloWorld.class was not created by javac."
          exit 1
        fi

        # 1. Tạo file MANIFEST.MF để chỉ định lớp chính (Main Class)
        echo "Main-Class: HelloWorld" > MANIFEST.MF

        # 2. Tạo file JAR (e: entry point, f: filename, m: manifest, *: all files)
        echo "Creating HelloWorld.jar..."
        jar cvfm HelloWorld.jar MANIFEST.MF HelloWorld.class

        # Kiểm tra file JAR đã được tạo chưa
        if [ ! -f HelloWorld.jar ]; then
          echo "Error: HelloWorld.jar was not created by jar utility."
          exit 1
        fi

        # 3. Kiểm tra file JAR bằng cách chạy nó
        echo "Testing HelloWorld.jar..."
        java -jar HelloWorld.jar > output.txt

        # 4. Kiểm tra đầu ra trong file output.txt
        if grep -q "Hello World!" output.txt; then
          echo "Test Passed: JAR built and output is correct."
        else
          echo "Test Failed: Output is not correct."
          cat output.txt
          exit 1
        fi

    - name: Upload JAR Artifact
      # Tùy chọn: Đăng file JAR lên GitHub để bạn có thể tải về
      uses: actions/upload-artifact@v4
      with:
        name: HelloWorld-jar-file
        path: HelloWorld.jar
